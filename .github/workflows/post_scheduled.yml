name: Bluesky Scheduled Posts

on:
  schedule:
    # Intentionally off the top of the hour to reduce GitHub Actions cron congestion.
    # GitHub's timezone-aware schedules handle EST/EDT automatically.
    - cron: '37 6 * * *'
      timezone: 'America/New_York'
    - cron: '43 17 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

# Never let two posting runs operate on the same repo-backed state simultaneously.
concurrency:
  group: bluesky-posting
  cancel-in-progress: false

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate bot content
        run: python bluesky_bot_scheduled.py --validate

      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python bluesky_bot_scheduled.py

      - name: Commit and push state changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bot_state.json scheduled_posts.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update bot state [skip ci]"
            git push
          fi
