name: Cronitor Monitoring Relay

on:
  workflow_run:
    # Monitor only the workflow that actually posts to Bluesky.
    workflows: ['Bluesky Scheduled Posts']
    types: [requested, completed]

permissions:
  actions: read
  contents: read

jobs:
  send-telemetry:
    runs-on: ubuntu-latest
    name: Send Telemetry
    steps:
      - name: Send execution details to Cronitor
        uses: cronitorio/monitor-github-actions@v7
        with:
          event: ${{ toJSON(github.event) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cronitor_key: ${{ secrets.CRONITOR_API_KEY }}
          cronitor_group: actions
          cronitor_notify: default
